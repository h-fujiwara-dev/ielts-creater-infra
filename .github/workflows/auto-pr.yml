name: Auto Create Pull Request

on:
  push:
    branches-ignore:
      - main
      - develop
      - prd

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR if none exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${GITHUB_REF#refs/heads/}"

          # 作業ブランチの分岐元(develop/prd)を merge-base で自動判定する。
          # develop起点の分岐点がprd起点の分岐点の子孫であればdevelop、逆であればprd。
          mb_dev=$(git merge-base origin/develop "$branch")
          mb_prd=$(git merge-base origin/prd "$branch")
          if git merge-base --is-ancestor "$mb_prd" "$mb_dev"; then
            base=develop
          else
            base=prd
          fi

          count=$(gh pr list --head "$branch" --base "$base" --state open --json number --jq 'length')
          if [ "$count" -eq 0 ]; then
            gh pr create --base "$base" --head "$branch" --fill
          else
            echo "PR already exists for $branch, skipping."
          fi
